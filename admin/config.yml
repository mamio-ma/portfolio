# Sveltia CMS configuration (Decap-compatible)
# Docs: https://github.com/sveltia/sveltia-cms
#
# Sign in: use "Sign In Using Access Token" with a GitHub fine-grained
# personal access token (see EDITING.md). "Sign In with GitHub" (OAuth) only
# works after you deploy your own sveltia-cms-auth relay and set base_url.

backend:
  name: github
  repo: mamio-ma/portfolio
  branch: main
  # Optional OAuth relay for the "Sign In with GitHub" button. There is no
  # public relay; deploy https://github.com/sveltia/sveltia-cms-auth on
  # Cloudflare Workers, then uncomment and set its URL:
  # base_url: https://<your-worker>.workers.dev

# Where images uploaded from the editor are stored / referenced.
# The site is served at the domain root, so public paths start at /assets.
media_folder: assets/img/uploads
public_folder: /assets/img/uploads
# Videos inserted with the toolbar "Video" button (admin/video-component.js)
# are stored here too: Sveltia ignores per-field folders inside editor
# components, so there is one upload folder for images and videos.

# Upload size cap, all files. GitHub's GraphQL API refuses request payloads
# over 45 MB and Sveltia base64-encodes the file (x1.37) into that payload,
# so anything over ~32 MB fails with "The request payload cannot be larger
# than 45MB" at save time. 30 MB keeps a margin and gives a clear error at
# upload time instead.
media_libraries:
  default:
    config:
      max_file_size: 31457280 # 30 MB

collections:
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{year}}/{{slug}}/"
    sortable_fields: [date, title]
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - label: "Table of contents"
        name: toc
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Sidebar, name: sidebar, widget: select, options: [left, right], default: left, required: false }
      - label: Body
        name: body
        widget: markdown
        # Rich text by default so the toolbar buttons (bold, italic, code, image)
        # are usable; Sveltia greys them out in raw mode. Markdown shortcuts
        # (`code`, **bold**, ``` blocks) still work while typing, and the
        # toolbar offers a switch to raw Markdown.
        modes: [rich_text, raw]
        hint: >-
          Images: the Title becomes the caption under the image. A single image
          fills the text width; upload several at once (kept on adjacent lines)
          to show them side by side, sharing the width equally.
