# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:v0.16.3
    build: .
    # uncomment these if you are having this issue with the build:
    # /usr/local/bundle/gems/jekyll-4.3.4/lib/jekyll/site.rb:509:in `initialize': Permission denied @ rb_sysopen - /srv/jekyll/.jekyll-cache/.gitignore (Errno::EACCES)
    # and fill the args values with the output of the commands on the right
    # build:
    #   args:
    #     GROUPID: # id -g
    #     GROUPNAME: # id -gn
    #     USERID: # id -u
    #     USERNAME: # echo $USER
    ports:
      - 8090:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    # Override the image's default entrypoint (/tmp/entry_point.sh). That script's
    # manage_gemfile_lock() runs `git ls-files --error-unmatch Gemfile.lock` to decide
    # whether to keep Gemfile.lock. Since site/ is vendored into a PARENT repo with no
    # .git of its own (and only site/ is bind-mounted here), that check always fails
    # inside the container, so the entrypoint deletes Gemfile.lock and bundler then
    # fails to find the git-sourced jekyll-terser gem. Bypassing the entrypoint and
    # running jekyll serve directly (same flags the entrypoint used) keeps
    # Gemfile.lock intact and uses the gems already baked into the image.
    entrypoint: []
    command:
      - bundle
      - exec
      - jekyll
      - serve
      - --watch
      - --port=8080
      - --host=0.0.0.0
      - --livereload
      - --verbose
      - --trace
      - --force_polling
